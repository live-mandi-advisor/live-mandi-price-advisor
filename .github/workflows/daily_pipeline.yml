name: Daily Mandi Data Pipeline

on:
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Diagnose API connectivity
        run: |
          python -c "import requests; print('Google:', requests.get('https://www.google.com', timeout=15).status_code)"
          python -c "import requests; r=requests.get('https://api.data.gov.in', timeout=15); print('Data.gov.in:', r.status_code)"

      - name: Fetch and store live mandi prices
        env:
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python data_pipeline/fetch_agmarknet.py